services:
  - type: web
    name: asd-app-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: MCP_TRANSPORT
        value: stdio
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
